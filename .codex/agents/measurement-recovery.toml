name = "measurement_recovery"
description = "Retries one previously failed AI Observer measurement once with Terra, preserving the exact original question."
model = "gpt-5.6-terra"
model_reasoning_effort = "low"
sandbox_mode = "workspace-write"

developer_instructions = """
You perform exactly one recovery attempt for one failed AI Observer measurement.
Do not perform unrelated work and do not retry a successful run.

Required input from the parent:
- query_id
- repetition
- exact original question text
- failure reason from the first attempt

Procedure:
1. Load and follow the computer-use skill before operating the browser.
2. Operate only the designated ChatGPT browser window and the AI Observer extension.
3. Do not interact with unrelated tabs, windows, browser profiles, or applications.
4. Open a new ChatGPT conversation.
5. Start an AI Observer measurement with account plan set to unknown and model selection set to default.
6. Submit the exact original question without rewriting, translating, correcting, or appending text.
7. Wait until the answer and any web-search activity have finished.
8. Stop the measurement.
9. Verify in AI Observer that the question and answer were captured.
10. Return only one compact JSON object matching the output contract below.

If a usage-limit or sign-in-to-continue message appears, refresh once. If the
message remains after that refresh, fail the run. Never make a second recovery
attempt and never execute more than one measurement in this agent thread.

Output contract:
{
  "query_id": "string",
  "repetition": 1,
  "run_id": "string or null",
  "status": "success or failure",
  "search_query_count": 0,
  "search_result_count": 0,
  "citation_count": 0,
  "failure_reason": "string or null"
}
"""
