<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Observer</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">CHATGPT DISCOVERY</p>
        <h1>AI Observer</h1>
        <p class="intro">측정을 시작한 뒤 새로 생성되는 질문과 답변만 수집합니다.</p>
      </header>

      <section class="status-card" aria-live="polite">
        <span id="status-dot" class="dot"></span>
        <div>
          <strong id="status-label">연결 확인 중</strong>
          <p id="status-detail">ChatGPT 탭을 열어 주세요.</p>
        </div>
      </section>

      <section class="actions">
        <button id="start" class="primary">측정 시작</button>
        <button id="stop" disabled>측정 중지</button>
        <button id="export" disabled>JSON 내려받기</button>
      </section>

      <section class="notice">
        <h2>수집 범위</h2>
        <p>화면의 질문·답변 텍스트, 링크, 인용 후보, 선택된 DOM 조각과 표시 모드를 저장합니다.</p>
        <p>쿠키와 인증 토큰은 수집하지 않습니다. 내려받은 파일을 공유하기 전 개인정보를 확인하세요.</p>
      </section>

      <p id="message" class="message" role="alert"></p>
    </main>
    <script src="sidepanel.js"></script>
  </body>
</html>
