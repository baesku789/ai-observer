<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Observer</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <main>
      <header>
        <h1>AI Observer</h1>
      </header>

      <section class="status-card" aria-live="polite">
        <span id="status-dot" class="dot"></span>
        <div>
          <strong id="status-label">연결 확인 중</strong>
          <p id="status-detail">ChatGPT 탭을 열어 주세요.</p>
        </div>
      </section>

      <section class="start-card">
        <label class="field">
          <span>측정 방식</span>
          <select id="measurement-type">
            <option value="independent_query">여러 질문을 각각 측정</option>
            <option value="conversation_journey">하나의 대화를 이어서 측정</option>
          </select>
        </label>
        <button id="start" class="primary start-button">측정 시작</button>
      </section>

      <section class="runner" id="query-runner">
        <h2>질문</h2>
        <textarea id="query-list-input" rows="5" placeholder="마곡에서 피부과 추천해줘&#10;마곡에서 여드름 치료 잘하는 곳 알려줘"></textarea>
        <label class="field compact-field">
          <span>질문별 반복 횟수</span>
          <input id="query-repetitions" type="number" min="1" max="20" value="1">
        </label>
        <div class="button-row">
          <button id="prepare-query-list" class="primary">질문 준비</button>
          <button id="clear-query-set">초기화</button>
        </div>
        <p id="runner-feedback" class="runner-feedback" aria-live="polite"></p>
        <div class="query-card" id="query-card" hidden>
          <span id="query-progress" class="query-progress"></span>
          <strong id="query-text"></strong>
          <span id="query-meta" class="query-meta"></span>
          <div class="button-row">
            <button id="copy-query">질문 복사</button>
            <button id="next-query">다음 질문 준비</button>
          </div>
        </div>
        <details class="advanced-import">
          <summary>JSON으로 가져오기 (고급)</summary>
          <textarea id="query-set-input" rows="5" spellcheck="false" placeholder="질문 세트 JSON을 붙여 넣으세요"></textarea>
          <button id="load-query-set">JSON 불러오기</button>
        </details>
      </section>

      <section class="actions">
        <button id="new-conversation" disabled>새 대화로 분리</button>
        <button id="stop" disabled>측정 중지</button>
        <button id="export" disabled>JSON 내려받기</button>
      </section>

      <p id="message" class="message" role="alert"></p>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
