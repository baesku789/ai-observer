<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AI Observer</title>
    <link rel="stylesheet" href="sidepanel.css">
  </head>
  <body>
    <main>
      <header><h1>AI Observer</h1></header>

      <section class="status-card" aria-live="polite">
        <span id="status-dot" class="dot"></span>
        <div>
          <strong id="status-label">연결 확인 중</strong>
          <p id="status-detail">ChatGPT 탭을 열어 주세요.</p>
        </div>
      </section>

      <section id="tab-warning" class="tab-warning" hidden>
        <strong>측정 탭이 변경되었습니다</strong>
        <p>일관된 측정을 위해 처음 시작한 ChatGPT 탭에서 계속 진행합니다.</p>
        <button id="return-to-tab" class="primary">측정 탭으로 이동</button>
      </section>

      <section id="workflow" class="workflow" hidden aria-live="polite">
        <span id="workflow-step" class="eyebrow"></span>
        <h2 id="workflow-title"></h2>
        <p id="workflow-instruction"></p>
        <div id="workflow-query" class="query-card" hidden>
          <span id="query-progress" class="query-progress"></span>
          <strong id="query-text"></strong>
          <button id="copy-query" class="primary">질문 복사</button>
        </div>
        <button id="confirm-new-chat" class="primary" hidden>새 채팅 열었어요</button>
        <button id="mark-complete" hidden>답변 완료로 표시</button>
        <button id="finish-measurement" class="primary" hidden>측정 종료</button>
      </section>

      <section id="setup" class="setup">
        <label class="field">
          <span>측정 방식</span>
          <select id="measurement-type">
            <option value="independent_query">질문마다 새 채팅에서 측정</option>
            <option value="conversation_journey">한 채팅에서 이어서 측정</option>
          </select>
        </label>

        <div class="settings-grid">
          <label class="field">
            <span>계정 플랜</span>
            <select id="account-plan">
              <option value="unknown">모름</option>
              <option value="free">Free</option>
              <option value="plus">Plus</option>
              <option value="max">Max</option>
              <option value="work">Work</option>
            </select>
          </label>
          <label class="field">
            <span>모델 선택</span>
            <select id="model-selection">
              <option value="default">기본 모델</option>
              <option value="manually_selected">직접 선택</option>
            </select>
          </label>
        </div>

        <div id="independent-settings">
          <div class="section-heading">
            <h2>측정할 질문</h2>
            <button id="add-query" class="small-button">+ 질문 추가</button>
          </div>
          <div id="query-list" class="query-list"></div>

          <div class="settings-grid">
            <label class="field">
              <span>질문별 반복</span>
              <input id="query-repetitions" type="number" min="1" max="20" value="1">
            </label>
            <label class="field">
              <span>채팅 모드</span>
              <select id="desired-chat-mode">
                <option value="temporary">임시 채팅</option>
                <option value="regular">일반 채팅</option>
              </select>
            </label>
          </div>
          <p class="setup-note">한 ChatGPT 탭에서 질문마다 새 채팅을 열어 측정합니다.</p>
        </div>

        <button id="start" class="primary start-button">측정 시작</button>

        <details class="advanced-import">
          <summary>질문 JSON 가져오기</summary>
          <textarea id="query-set-input" rows="5" spellcheck="false" placeholder="질문 세트 JSON을 붙여 넣으세요"></textarea>
          <button id="load-query-set">JSON 불러오기</button>
        </details>
      </section>

      <section id="results" class="results" hidden>
        <button id="export" class="primary">JSON 내려받기</button>
      </section>

      <button id="stop" class="quiet-action" hidden>측정 중지</button>
      <p id="message" class="message" role="alert"></p>
    </main>
    <script type="module" src="sidepanel.js"></script>
  </body>
</html>
